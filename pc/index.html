<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de contraseñas</title>
<style>
  :root {
    --bg: #0f1220; --panel: #171a2e; --panel-2: #1e2240; --line: #2a2f55;
    --text: #e8eaf6; --muted: #9096b8; --accent: #6c7bff; --accent-2: #8f5bff;
    --danger: #ff5d73; --ok: #3ddc97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 20% -10%, #232a63 0%, var(--bg) 60%);
    color: var(--text); font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
  }
  .app {
    width: min(920px, 94vw); height: min(620px, 92vh); display: flex;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden;
  }
  nav { width: 220px; padding: 24px 14px; background: var(--panel-2); border-right: 1px solid var(--line); }
  nav h1 { font-size: 17px; margin: 0 10px 22px; display: flex; gap: 10px; align-items: center; }
  nav h1 span { font-size: 22px; }
  nav button {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 6px;
    background: transparent; color: var(--muted); border: 0; border-radius: 10px; cursor: pointer;
    font: inherit; text-align: left; transition: .15s;
  }
  nav button:hover { background: rgba(255,255,255,.05); color: var(--text); }
  nav button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  nav .count { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.15); padding: 1px 8px; border-radius: 99px; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 24px 28px 12px; }
  header h2 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .list { flex: 1; overflow-y: auto; padding: 4px 28px; }
  .head, .row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: center; }
  .head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 8px 14px; }
  .row { padding: 12px 14px; margin-bottom: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; }
  .row:hover { border-color: var(--accent); }
  .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pass { font-family: Consolas, monospace; color: #b9c0ff; }
  .actions { display: flex; gap: 4px; }
  .icon {
    background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 6px 8px;
    border-radius: 8px; font-size: 15px;
  }
  .icon:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .icon.del:hover { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); margin-top: 70px; }
  .empty div { font-size: 42px; margin-bottom: 8px; }

  footer { padding: 16px 28px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
  .btn {
    border: 0; border-radius: 10px; padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; transition: .15s;
  }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .btn.primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.ghost:hover { background: rgba(255,255,255,.06); }

  form { flex: 1; padding: 8px 28px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 520px; }
  label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
  input {
    background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
    padding: 12px 14px; font: inherit; outline: none; transition: .15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,123,255,.25); }
  input.error { border-color: var(--danger); }
  .msg { color: var(--danger); font-size: 13px; min-height: 18px; }
  .buttons { display: flex; gap: 10px; margin-top: 4px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ok); color: #05281a; padding: 10px 18px; border-radius: 10px; font-weight: 600;
    transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) { nav { width: 72px; } nav h1 b, nav button .label, nav .count { display: none; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1><span>🔐</span><b>Mis claves</b></h1>
    <button data-sec="correos"><span>✉️</span><span class="label">Correos</span><span class="count" id="c-correos"></span></button>
    <button data-sec="webs"><span>🌐</span><span class="label">Webs</span><span class="count" id="c-webs"></span></button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const SECTIONS = {
  correos: { title: "Correos", sub: "Cuentas de correo guardadas", field: "Correo", ph: "ejemplo@correo.com", type: "email" },
  webs:    { title: "Webs",    sub: "Sitios web guardados",        field: "Web",    ph: "https://ejemplo.com", type: "text" }
};
const KEY = "gestor-contrasenas-v1";
let data = { correos: [], webs: [] };
try { Object.assign(data, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
let current = "correos";

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast("No se pudo guardar"); } };

function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
}

function counts() {
  for (const k in SECTIONS) $("#c-" + k).textContent = data[k].length;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.sec === current));
}

function showList() {
  const s = SECTIONS[current], items = data[current];
  counts();
  $("#main").innerHTML = `
    <header><h2>${s.title}</h2><p>${s.sub}</p></header>
    <div class="list">
      ${items.length ? `<div class="head"><div>${s.field}</div><div>Contraseña</div><div></div></div>` +
        items.map((it, i) => `
        <div class="row">
          <div class="cell">${esc(it.user)}</div>
          <div class="cell pass" data-i="${i}" data-shown="1">${esc(it.pass)}</div>
          <div class="actions">
            <button class="icon" data-act="eye" data-i="${i}" title="Mostrar/ocultar">👁️</button>
            <button class="icon" data-act="copy" data-i="${i}" title="Copiar contraseña">📋</button>
            <button class="icon del" data-act="del" data-i="${i}" title="Eliminar">🗑️</button>
          </div>
        </div>`).join("")
      : `<div class="empty"><div>📭</div>Aún no hay nada guardado.<br>Pulsa «Añadir» para empezar.</div>`}
    </div>
    <footer><button class="btn primary" id="add">+ Añadir</button></footer>`;
  $("#add").onclick = showForm;
}

function showForm() {
  const s = SECTIONS[current];
  $("#main").innerHTML = `
    <header><h2>Añadir a ${s.title}</h2><p>Rellena los dos campos y pulsa Aceptar</p></header>
    <form id="form" novalidate>
      <label>${s.field}<input id="f-user" type="${s.type}" placeholder="${s.ph}" autocomplete="off"></label>
      <label>Contraseña<input id="f-pass" type="text" placeholder="Contraseña" autocomplete="off"></label>
      <div class="msg" id="msg"></div>
      <div class="buttons">
        <button type="submit" class="btn primary">Aceptar</button>
        <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      </div>
    </form>`;
  const u = $("#f-user"), p = $("#f-pass");
  u.focus();
  $("#cancel").onclick = showList;
  $("#form").onsubmit = e => {
    e.preventDefault();
    const user = u.value.trim(), pass = p.value.trim();
    u.classList.toggle("error", !user); p.classList.toggle("error", !pass);
    if (!user || !pass) { $("#msg").textContent = "Los campos no pueden estar vacíos."; (user ? p : u).focus(); return; }
    data[current].push({ user, pass });
    save(); showList(); toast("Guardado ✔");
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { current = b.dataset.sec; showList(); });

$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const i = +b.dataset.i, it = data[current][i];
  if (b.dataset.act === "del") {
    if (confirm(`¿Eliminar "${it.user}"?`)) { data[current].splice(i, 1); save(); showList(); }
  } else if (b.dataset.act === "copy") {
    navigator.clipboard.writeText(it.pass).then(() => toast("Contraseña copiada"), () => toast("No se pudo copiar"));
  } else {
    const cell = document.querySelector(`.pass[data-i="${i}"]`), shown = cell.dataset.shown === "1";
    cell.textContent = shown ? "•".repeat(Math.min(it.pass.length, 14)) : it.pass;
    cell.dataset.shown = shown ? "0" : "1";
  }
});

showList();
</script>
</body>
</html>
